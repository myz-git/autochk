# 主机规则
osrule: 
  cpustat: 
    nm: CPUSTAT
    title: "CPU负载检查"
    desc: "查看主机负载情况,id为空闲时间百分比,值越高负载越小"
    idle_le1: 20
    idle_le2: 10
    swap_ge1: 100
    swap_ge2: 1000
  memstat: 
    nm: MEMSTAT
    title: "内存使用检查"
    desc: "查看空闲内存是否足够,是否频繁使用换页SWAP"
    available_le1:  4096
    available_le2:  2048
  iostat: 
    nm: IOSTAT
    title: "磁盘IO负载检查"
    desc: "查看主机IO及磁盘IO负载情况, 当有磁盘%util 超过85%时说明该磁盘非常繁忙, 需要进一步分析或优化IO负载"
    diskutil_ge1: 80
    diskutil_ge2: 95
  filesystem: 
    nm: FILESYSTEM
    title: "文件系统使用率"
    desc: "查看文件系统使用率,文件系统使用率小于80%为正常"
    disk_ge1: 80%
    disk_ge2: 90%
  inodeusage: 
    nm: INODEUSAGE
    title: "索引资源节点使用率"
    desc: "查看文件系统索引资源节点使用率小于80%为正常"
    inode_ge1: 80%
    inode_ge2: 90%
  thpstat: 
    nm: THPSTAT
    title: "主机透明大页检查"
    desc: "查看主机透明大页配置情况,为提升系统稳定性建议关闭透明在大页"
  osparameter: 
    nm: OSPARAMETER
    title: "内核参数"
    desc: "查看主机内核参数配置情况"
    file-max: 6815744
    aio-max-nr: 3145728
    shmmni: 4096
    #shmmax: 7882853580
    #shmall: 2099481
    sem: [250, 256000, 100, 1024]
    panic_on_oops: 1
    randomize_va_space: 0
    numa_balancing: 0
    rp_filter_all: 2
    rp_filter_default: 2
    ip_local_port_range: [9000, 65500]
    ipfrag_high_thresh: 16777216
    ipfrag_low_thresh: 15728640
    tcp_keepalive_time: 300
    rmem_default: 262144
    rmem_max: 4194304
    wmem_default: 262144
    wmem_max: 1048576
    swappiness: 1
    min_free_kbytes: 67584
    dirty_ratio: 10
    dirty_background_ratio: 3
    dirty_expire_centisecs: 500
    dirty_writeback_centisecs: 100
    disable_ism_large_pages: [0xF4,0x74]
  ulimit: 
    nm: ULIMIT
    title: "资源限制"
    desc: "查看用户主机资源限制配置情况"
    memlock: -1
    open_files: 65536
    max_user_rocesses: 16384
  numa: 
    nm: NUMA
    title: "NUMA使用检查"
    desc: "查看主机NUMA状态,NUMA特性会对数据库服务器稳定运行带来非常大的影响,为避免系统性能隐患,建议关闭NUMA"
    flg1: "No NUMA"
    flg2: "NUMA turned off"
  ntp: 
    nm: NTP
    title: "时间同步检查"
    desc: "查看主机NTP或chronyd时间同步服务是否启用"
  tmzone: 
    nm: TMZONE
    title: "时区检查"
    desc: "检查系统时区是否为东八区, 建议将系统时区设置为东八区"
  selinux: 
    nm: SELINUX
    title: "SELinux状态检查"
    desc: "检查SELinux状态, 建议关闭SELinux"
  firewall: 
    nm: FIREWALL
    title: "防火墙状态检查"
    desc: "检查防火墙状态, 建议关闭防火墙"
  nsswitch: 
    nm: NSSWITCH
    title: "NSSwitch配置检查"
    desc: "检查NSSwitch配置是否有NIS, 建议关闭NSSwitch中NIS配置"
  lo_mtu: 
    nm: LO_MTU
    title: "lo网卡MTU检查"
    desc: "检查LO网卡的默认MTU是否过大, 建议修改为16436"
  machine_platform: 
    nm: MACHINE_PLATFORM
    title: "主机平台检查"
    desc: "检查主机类型是否为物理服务器"
  cpu_perf_mode: 
    nm: CPU_PERF_MODE
    title: "CPU性能模式检查"
    desc: "检查CPU是否处于性能模式, 建议调整CPU为性能模式"
  nozeroconf: 
    nm: NOZEROCONF  
    title: "ZEROCONF路由检查"
    desc: "检查是否禁用ZEROCONF路由配置, 建议设置NOZEROCONF为yes"
  rpm_packages: 
    nm: RPM_PACKAGES
    title: "安全漏洞RPM包检查"
    desc: "检查主机是否安装了存在安全漏洞的RPM包, 建议卸载存在安全隐患的RPM包"
    rpm_list: [firefox, freetype, ghostscript, open-vm-tools, libsmbclient, libwbclient, samba-client-libs, samba-common-libs]
# 数据库规则
dbrule: 
  # 数据库实例分析
  dbstatus: 
    nm: DBSTATUS
    title: "数据库状态检查"
    desc: "数据库状态检查主要包括：数据库启动状态,Dataguard保护模式,保护级别,数据库角色等。"
    status: READ
  logmode: 
    nm: LOGMODE
    title: "归档模式检查"
    desc: "检查数据库日志模式,建议开启归档模式(ARCHIVELOG)以确保数据安全"
    status: ARCHIVELOG
  db_lang: 
    nm: DB_LANG
    title: "数据库语言检查"
    desc: "检查数据库语言设置,建议结合实际情况排查数据库语言设置是否合理。"
  dbcursize: 
    nm: DBCURSIZE
    title: "数据库当前使用大小"
    desc: "记录数据库当前实际使用大小(dba_segments)。"
  dbf_size: 
    nm: DBF_SIZE
    title: "数据文件总大小"
    desc: "记录数据库所有数据文件总大小(含TEMP及REDO文件)。"
  dbf_cnt: 
    nm: DBF_CNT
    title: "数据文件数量检查"
    desc: "检查数据文件数量是否接近db_files参数,如果接近时需要及时修改db_files参数(重启生效)。"
  dbf_stat: 
    nm: DBF_STAT
    title: "数据文件状态检查"
    desc: "检查数据库文件状态是否正常。"
    status: AVAILABLE
  tmpfile_size: 
    nm: TMPFILE_SIZE
    title: "临时表空间文件大小"
    desc: "记录临时表空间数据文件大小。"
  dbtbsusage: 
    nm: DBTBSUSAGE
    title: "表空间使用率"
    desc: "针对表空间使用率超过80%且剩余空间不足8G,进行预警。"
    tbsutil_ge1: 80
    tbsutil_ge2: 90
    freesize_le1: 8
    freesize_le2: 4
  dbcontrolfile: 
    nm: DBCONTROLFILE
    title: "控制文件检查"
    desc: "检查控制文件路径信息:控制文件至少要有2路冗余,才符合安全配置要求,并建议检查是否放在在不同存储路径上。"  
    cnt_le1: 2
  user_info:
    nm: USER_INFO
    title: "用户信息"
    desc: "记录数据库用户信息"
  user_size: 
    nm: USERSIZE
    title: "数据库用户大小"
    desc: "记录数据库各个用户大小"
  tab_info:
    nm: TAB_INFO
    title: "表信息"
    desc: "记录数据库各个用户表数量"
  tab_parallel:
    nm: TAB_PARALLEL
    title: "并行度>1的表"
    desc: "OLTP系统建议所有对象并行度不应大于0"
    result: "no rows selected"
  inx_parallel:
    nm: INX_PARALLEL
    title: "并行度>1的索引"
    desc: "OLTP系统建议所有对象并行度不应大于0"
    result: "no rows selected"

  invalid_obj: 
    nm: INVALID_OBJ
    title: "无效对象检查"
    desc: "检查数据库是否存在大量无效对象"
    result: 10

  invalid_inx: 
    nm: INVALID_INX
    title: "无效索引检查"
    desc: "如存在无效(不可用)索引,需要对索引进行重建或删除。"
    result: "no rows selected"

  dbsequence: 
    nm: DBSEQUENCE
    title: "SEQUENCE序列设置检查"
    desc: "RAC环境下, 在高负载数据库高频访问的sequence如果 cache小于400会引起性能下降。建议为修改sequence的cache 400或以上及NOORDER。"
    result: "no rows selected"
  db_seq_usage: 
    nm: DB_SEQ_USAGE
    title: "序列最大值使用检查"
    desc: "检查SEQUENCE当前值是否接近最大值限制的80%, 当SEQUENCE接近最大值时,建议使用命令来修改最大值alter sequence <name> nomaxvalue。"
    result: "no rows selected"
  
  dbredoswitch: 
    nm: DBREDOSWITCH
    title: "归档切换检查"
    desc: "对Oracle数据库的归档切换次数进行检查,建议日平均15-20 分钟切换一次, 业务高峰期也尽量大于5分钟一次。"
    sw_cnt_ge1: 12

  dbredocheck: 
    nm: DBREDOCHECK
    title: "REDO文件检查"
    desc: "检查REDO文件是否过小,建议生产环境每个redo文件在200M-4G之间。"
    rdf_size: 200
    rdf_status_list: [INACTIVE,ACTIVE,CURRENT,UNUSED,CLEARING]

  db_shp_size: 
    nm: DB_SHP_SIZE
    title: "共享池使用率"
    desc: "检查共享池的大小"
  db_shp_pct: 
    nm: DB_SHP_PCT
    title: "共享池使用率"
    desc: "检查共享池的使用占比,通常SHARED_POOL的使用率不应超过SGA_SIZE的60%"
  dboption: 
    nm: DBOPTION
    title: "数据库选项功能启用状态"
    desc: "查询数据库可选功能（Options/Features）的启用状态。"
  dbfeatures: 
    nm: DBFEATURES
    title: "数据库选项功能使用情况"
    desc: "查询数据库可选功能详细的使用情况统计信息。"


  # 数据库性能分析
  db_4031check: 
    nm: DB_4031CHECK
    title: "4031问题检查"
    desc: "SHARED POOL空闲列表FREE LIST不能满足请求的次数,此时需要FLUSH LRU LIST。"
  dbresource: 
    nm: DBRESOURCE
    title: "最大资源使用限制检查"
    desc: "检查CURRENT_UTILIZATION的值和MAX_UTILIZATION的值要接近LIMIT_VALUE值。"
    res_use_ge1: 90
  loadprofile: 
    nm: LOADPROFILE
    title: "数据库负载"
    desc: "检查每秒产生redo数据量是否过大,以及登录数是否过大"
    redosize: 50
    logon: 30
  instefficiency: 
    nm: INSTEFFICIENCY
    title: "数据库性能运行效率"
    desc: "在Oracle AWR报告中,Library Cache Hit Ratio(库缓存命中率)是一个重要的性能指标。如果该指标低于90%,则可能会影响数据库的性能。"
    buffer_hit: 90
    library_hit: 90
    soft_parse: 90
  topevent: 
    nm: TOPEVENT
    title: "TOP等待事件检查"
    desc: "检查常见非空闲等待事件。"
  topsql_by_ela: 
    nm: 模版ll TOPSQL_BY_ELA
    title: "TOP SQL语句(最大消耗时间)"
    desc: "根据执行次数和单次执行时间综合检查,建议对于高频执行的SQL语句单次执行时间不超过2秒。"
  
    
  #数据库实例分析
  cursor_share_mem: 
    nm: CURSOR_SHARE_MEM
    title: "游标共享内存使用"
    desc: "检查SQL游标共享内存的使用情况,对于游标共享内存使用>300M的SQL语句建议优化"
    result: "no rows selected"
  recovery_usage: 
    nm: RECOVERY_USAGE
    title: "闪回区使用检查"
    desc: "检查闪回区空间使用情况, 建议及时清理或扩容闪回区。"
    result: [60, 80]
  recovery_detail: 
    nm: RECOVERY_DETAIL
    title: "闪回区使用DETAIL"
    desc: "检查闪回区空间使用情况, 建议及时清理或扩容闪回区。"
    result: ""
  dbparameter: 
    nm: DBPARAMETER
    title: "数据库初始化参数检查"
    desc: "检查Oracle初始化参数,建议结合实际情况排查数据库重要参数设置是否合理。"  
  db_parameter_file: 
    nm: DB_PARAMETER_FILE
    title: "数据库初始化参数检查（详细）"
    desc: "检查Oracle初始化参数,建议结合实际情况排查数据库重要参数设置是否合理。"
    
  # 数据库安全检查
  db_expir_user: 
    nm: DB_EXPIR_USER
    title: "数据库用户临期检查"
    desc: "检查数据库用户口令过期时间小于30天,当达到口令过期时间用户将会被锁定,业务用户未提前处理会造成业务中断。" 
    result: "no rows selected"

  db_password_verif: 
    nm: DB_PASSWORD_VERIF
    title: "PROFILE密码复杂性验证"
    desc: "用户未设置密码复杂性验证, 建议设置密码复杂性检查ALTER PROFILE <profile_name> LIMIT PASSWORD_VERIFY_FUNCTION <function_name>;"
    result: "no rows selected"

  userfailedlogin: 
    nm: USERFAILEDLOGIN
    title: "密码错误用户锁定检查"
    desc: "检查数据库用户登录失败次数,建议对于业务用户不做登录失败锁定限制。" 
    result: "no rows selected"
  dbdbapriv: 
    nm: DBDBAPRIV
    title: "具有DBA权限的账户检查"
    desc: "数据库存在多个具有DBA权限的账户,存在安全风险,建议只保留一个DBA账户,收回其他DBA用户权限。"
    result: "no rows selected"
  dbsysdba: 
    nm: DBSYSDBA
    title: "数据库SYSDBA权限检查"
    desc: "检查数据库SYSDBA权限,建议整改,收回SYSDBA并授予最小使用权限。"
    result: "no rows selected"
  dbauditsegment: 
    nm: DBAUDITSEGMENT
    title: "审计数据大小检查"
    desc: "数据库审计数据占用过多存储空间,建议在满足审计监管要求下定期清理或档数据。"
    result: 10
  dbauditcont: 
    nm: DBAUDITCONT
    title: "审计对象数量检查"
    desc: "审计对象长期不归档或清理, 建议在满足审计监管要求下定期清理或档数据。"
    result: 100000
  db_nosys_in_system: 
    nm: DB_NOSYS_IN_SYSTEM
    title: "系统表空间上的业务对象"
    desc: "不建议使用SYSTEM、SYSAUX表空间存储业务账户对象。"
    resultB: "no rows selected"
  dbvirscheck: 
    nm: DBVIRSCHECK
    title: "病毒勒索攻击检查"
    desc: "检查数据库是否被病毒（如比特币勒索）攻击,需要立即处理。"
    resultR: "no rows selected"    
  dbrmancheck: 
    nm: DBRMANCHECK
    title: "数据库备份"
    desc: "检查当天备份结果是否有error和warning,如果有建议检查。"
    resultB: "WARNINGS"
    resultR: "ERROR"
  dbscnhealthcheck: 
    nm: DBSCNHEALTHCHECK
    title: "SCNHealthCheck检查"
    desc: "检查Oracle数据库当前scn的增长速度是否在正常范围内, 正常结果应该为: Result: A。"
    resulta: "Result: A"
    resultb: "Result: B"
    resultc: "Result: C"

  # 数据库监控、DataGuard、备份及杂项分析
  dberrlog: 
    nm: DBERRLOG
    title: "数据库日志检查"
    desc: "检查数据库近期(一般为30天)日志是否有重要报错"
    resultB: "no rows selected"
  dblsnrinfo: 
    nm: DBLSNRINFO
    title: "监听状态及日志检查"
    desc: "监听日志文件较大,影响监听响应性能,建议定期清理保持在2G以下。"
    log_size: 2147483648
  dbdglagcheck: 
    nm: DBDGLAGCHECK
    title: "DataGuard同步延迟检查"
    desc: "检查gap延迟,通常情况下gap Value值应该<20秒。"
    resultB: 1
  dbdgerrcheck: 
    nm: DBDGERRCHECK
    title: "DataGuard同步报错检查"
    desc: "检查数据库日志中是否存在DataGuard不同步的报错。"
    resultG: ""
  dbpsu: 
    nm: DBPSU
    title: "数据库PSU补丁集检查"
    desc: "检查数据库安装的PSU补丁集,建议重要系统一年更新一次PSU(可选择次新psu补丁集)。"
  dbpatch: 
    nm: DBPATCH
    title: "补丁集检查"
    desc: "记录数据库安装了哪些补丁, 供其他项分析参考。"

  #集群检查
  crs_stat: 
    nm: CRS_STAT
    title: "RAC资源状态"
    desc: "检查是否有UNKNOW或target与state状态不一致(除GDS外)"
    result: ""

  crs_stat2: 
    nm: CRS_STAT2
    title: "RAC资源状态"
    desc: "查看RRAC资源状态"
    result: ""

  ocr_info:  
    nm: OCR_INFO
    title: "OCR状态"
    desc: "查看OCR使用情况"
    result: ""

  ocr_bak_check: 
    nm: OCR_BAK_CHECK
    title: "OCR备份检查"
    desc: "检查OCR备份是否正常"
    result: ""

  asm_usage: 
    nm: ASM_USAGE
    title: "ASM磁盘组使用率"
    desc: "查看pct_used_usable是否>90%, 如果>90%建议及时扩容磁盘组"
    result: ""

  asm_offset: 
    nm: ASM_OFFSET
    title: "ASM磁盘偏移检查"
    desc: "查看各个Asm磁盘使用是否一致,如果偏移>10%需要及时维护校准"
    result: "no rows selected"





